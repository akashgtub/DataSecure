[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datasecure"
version = "0.1.0"
description = "AI Security Scanning Tool for datasets, models, code, and configurations."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "DataSecure Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
datasecure = "datasecure.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["datasecure*"]
